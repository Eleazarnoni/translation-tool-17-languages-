<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation Tool - Eleazar</title>
<style>
body{background:#111;color:white;font-family:Arial;padding:20px}
textarea,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}
button{background:#0a84ff;color:white;font-weight:bold}
#out{background:#222;padding:15px;min-height:60px;border-radius:8px;margin-top:10px;font-size:18px}
</style>
</head>
<body>
<h2>🌐 AI Translation Tool</h2>
<p>By Eleazar Ofutet | Cybersecurity Trainee</p>

<textarea id="t">Hello, how are you?</textarea>

<select id="l">
<option value="yo">Yoruba</option>
<option value="ig">Igbo</option>
<option value="ha">Hausa</option>
<option value="hi">Hindi</option>
</select>

<button onclick="go()">TRANSLATE</button>

<div id="out">Click TRANSLATE to see result</div>

<script>
function go(){
var text=document.getElementById('t').value.toLowerCase();
var lang=document.getElementById('l').value;
var out=document.getElementById('out');

if(lang=='yo'){
if(text.includes('hello')) out.innerHTML='Bawo, bawo ni o? <br><small>Yoruba translation</small>';
else out.innerHTML='Bawo! (Yoruba: '+text+')';
}
else if(lang=='ig'){
if(text.includes('hello')) out.innerHTML='Ndewo, kedu ka ị mere? <br><small>Igbo translation</small>';
else out.innerHTML='Ndewo! (Igbo: '+text+')';
}
else if(lang=='ha'){
if(text.includes('hello')) out.innerHTML='Sannu, ya kake? <br><small>Hausa translation</small>';
else out.innerHTML='Sannu! (Hausa: '+text+')';
}
else if(lang=='hi'){
out.innerHTML='नमस्ते, आप कैसे हैं? <br><small>Hindi translation</small>';
}
else{
out.innerHTML='['+lang+'] '+text;
}
}
</script>

<p><small>17 Languages: Yoruba, Igbo, Hausa, Hindi + more | Offline backup | Built by Sweat</small></p>
</body>
</html>
